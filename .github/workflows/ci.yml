name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # A manual run tests a branch before it reaches main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test both Go modules with the race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'

      - name: Test KVLite
        run: go test -race -timeout=10m ./...

      - name: Test KVBench
        working-directory: benchmarks/kvbench
        run: go test -race -timeout=10m ./...

  test-platforms:
    name: Test KVLite on ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    # The test job above tests linux/amd64.
    # KVBench needs cgo for LMDB, so this job tests KVLite only.
    # An amd64 runner runs 386 programs natively, so the 386 targets run real 32-bit builds.
    # Go has no darwin/386 port, and macOS runs no 32-bit programs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: 386, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: linux, goarch: arm, runner: ubuntu-24.04 }
          - { goos: windows, goarch: amd64, runner: windows-2025 }
          - { goos: windows, goarch: 386, runner: windows-2025 }
          - { goos: windows, goarch: arm64, runner: windows-11-arm }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-15 }
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'

      # No hosted runner runs 32-bit Arm programs, so QEMU runs the linux/arm tests on the amd64 runner.
      - name: Install QEMU for linux/arm
        if: matrix.goarch == 'arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          echo "GOFLAGS=-exec=qemu-arm" >> "$GITHUB_ENV"

      - name: Test KVLite
        run: go test -timeout=20m ./...

  vet:
    name: Vet both Go modules on linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'

      # go test runs only a subset of the vet checks, so this step runs all of them.
      - name: Vet KVLite
        run: go vet ./...

      - name: Vet KVBench
        working-directory: benchmarks/kvbench
        run: go vet ./...

  build:
    name: Build KVLite for each cross-platform target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'

      # These targets only build. The test jobs above run the tests.
      # The loop reports every failing target before the step fails.
      - name: Build KVLite for each target
        run: |
          failed=0
          for target in aix/ppc64 android/arm64 linux/386 linux/amd64 linux/arm linux/arm64 linux/loong64 linux/mips linux/mips64 linux/mips64le linux/mipsle linux/ppc64 linux/ppc64le linux/riscv64 linux/s390x openbsd/386 openbsd/amd64 openbsd/arm openbsd/arm64 openbsd/ppc64 openbsd/riscv64 solaris/amd64 windows/386 windows/amd64 windows/arm64; do
            echo "go build for $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... || failed=1
          done
          exit "$failed"
